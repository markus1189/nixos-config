# statix (nix linter) policy for this tree.
#
# Enforced by `nix flake check` (checks.x86_64-linux.statix) and read by the
# same binary that the emacs flymake nix-mode backend runs, so editor and CI
# agree on what counts as a lint.
#
# Fix locally: `statix fix --dry-run` for a diff, `statix fix` to apply.
# List all lint names: `statix list`.

# hardware-configuration.nix: generated by nixos-generate-config — not ours to
# restyle, and it comes back unchanged the next time hardware moves.
#
# .direnv: nix-direnv puts symlinks to the flake's *inputs* under
# .direnv/flake-inputs, and statix follows them straight into nixpkgs — 25292
# warnings about someone else's code. The directory is gitignored (globally,
# via core.excludesFile) but statix walks into it anyway, so it has to be named
# here as well.
ignore = [
  "hardware-configuration.nix",
  ".direnv",
]

# repeated_keys (W20): this tree deliberately writes several `boot = { ... }` /
# `services = { ... }` blocks grouped by topic instead of merging every path
# into one attrset. Merging them would be worse to read, not better.
disabled = [ "repeated_keys", "empty_pattern" ]

# empty_pattern (W10) would rewrite the `{ ... }:` header every NixOS and
# home-manager module carries into `_:`. It works, but the explicit pattern is
# what the module system's docs and the rest of this tree use.
