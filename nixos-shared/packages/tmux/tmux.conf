unbind C-b
unbind '"'
unbind "'"
unbind %
unbind &

set-option -g set-titles on
set-option -g set-titles-string "#{session_name}:#{pane_current_command}:#{pane_current_path}"

set-option -g prefix C-k
set-option -sg escape-time 10

set-window-option -g mouse off
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on

set-option -g default-terminal "screen-256color"
# Disable 'indn' capability to fix scrollback truncation (tmux/tmux#89)
# Without this, bulk scrolling doesn't preserve lines in scrollback buffer
set -ga terminal-overrides ',*256col*:indn@'

set-option -g history-limit 31337
# max size = min(connected user)
set-window-option -g aggressive-resize on

set-option -g remain-on-exit on

set-option -g renumber-windows on

# Agents get a marker + their OSC title (pi runs via npx, so it reads as "npm"),
# shells "󰆍 " + cwd basename. A ':' inside a modifier arg ends it: no [:alnum:].
set-window-option -g automatic-rename-format "#{=/16/…:#{?pane_in_mode,[tmux],#{?#{m|r:^(claude|npm|node|pi)$,#{pane_current_command}},#{?#{==:#{pane_current_command},claude},✳ ,π }#{s/^[^a-zA-Z0-9 ]+ (- )?//:#{pane_title}},#{?#{m|r:^(zsh|bash|fish)$,#{pane_current_command}},󰆍 #{b:pane_current_path},#{pane_current_command}}}}}#{?pane_dead,[dead],}"

bind TAB last-window
bind C-k send-prefix

# hold prefix once, mash n/p
bind -r n next-window
bind -r p previous-window

# prefix-less window jump (base-index 1 + renumber-windows on = gapless)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

bind , command-prompt "rename-window '%%'"

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind x kill-pane
bind X kill-window
bind O kill-pane -a

bind a set-window-option monitor-activity on
bind A set-window-option monitor-activity off

bind b run "tmux capture-pane -p | xclip -i -sel clipboard"
bind v run-shell 'f=$(mktemp --suffix=.log); tmux capture-pane -ep -S -200 -pt "#{pane_id}" > "$f"; tmux split-window -h -t "#{pane_id}" "less -S -R +G \"$f\"; rm \"$f\""'

bind r respawn-pane -c "#{pane_current_path}" -k
bind R confirm-before -p "Reload /etc/tmux.conf?" "source-file /etc/tmux.conf"

# choose a session to move current pane/window to
bind C-p choose-session "move-pane -t %%"
bind C-w choose-session "move-window -t %%"
bind s choose-session
bind S choose-window

# fuzzy window jump within the current session (fzf popup + live pane preview)
bind w display-popup -E -w 80% -h 70% "tmux list-windows -F '#{session_name}:#{window_index}\t#{window_name}\t#{pane_current_command}' | fzf --reverse --delimiter='\t' --with-nth=2,3 --preview 'tmux capture-pane -ep -t {1}' --preview-window=right:55% | cut -f1 | xargs -r tmux select-window -t"

# choose window to join into current pane
bind @ choose-window "join-pane -hs %1"

# respawn panes
bind Space confirm-before -p "Respawn pane?" "respawn-pane -c \"#{pane_current_path}\" -k"
bind C-Space command-prompt -p "respawn with:" "respawn-pane -c \"#{pane_current_path}\" -k '%%'"
# focus the most recently active window in this session with a bell/activity/silence flag
bind BSpace run-shell "@next-bell@"

bind Enter resize-pane -Z

bind C confirm-before -p "Clear history?" "clear-history"

bind P run-shell -b "printf 'tmux pane %s' '#{pane_id}' | xclip -i -sel clipboard" \; display-message 'Pane ID copied: tmux pane #{pane_id}'
bind -T copy-mode-vi 'v' send-keys -X begin-selection
bind -T copy-mode-vi 'V' send-keys -X rectangle-toggle

bind m setw monitor-activity\; display-message -d 5 \
    "Watching for activity: #{?monitor-activity,ON,OFF}"
bind M command-prompt -p \
    "Watching for silence (0 disables; current: #{monitor-silence}):" \
    "setw monitor-silence %%"

# now handled by tmux-plugin yank
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard >/dev/null'
bind -T copy-mode-vi Space send-keys -X page-down

# only works if ? is not rebound in copy-mode and triggers search-backwards !
bind "{" run "tmux copy-mode ; tmux send-key '?'"

bind ` if-shell -F '#{==:#{session_name},popup-scratch}' \
  'detach-client' \
  'display-popup -d "#{pane_current_path}" -E @popup-scratch@'

set-option -g pane-border-style "fg=white,bg=colour232"

set-option -g pane-active-border-style "fg=colour214,bg=colour232"

set-option -g message-style "fg=white,bg=black,bright"

set -g display-panes-active-colour colour214
set -g display-panes-colour colour255
set -g display-panes-time 5000

set -g clock-mode-colour colour214

set -g status on
set -g status-interval 15
# set-option -g status-utf8 on
set-option -g status-justify left

set -g status-style "fg=colour231,bg=colour234"

# Each window is a rounded pill. The fill stays neutral for every state except
# an alert, so a bell is the only saturated background anywhere on the bar;
# where you are is carried by text colour instead. Cap and fill share one
# colour, computed once here: a #{} inside a #[] is expanded before the style
# is parsed, so #[fg=colour#{E:@win-fill}] resolves and the states do not each
# need a hand-written copy of the whole format.
# The last (alternate) window -- what "bind TAB" flips back to -- is colour151,
# a pale sage picked to sit at the same lightness as the 252 of ordinary windows
# so it reads as a hue change, not a brightness change. It deliberately avoids
# colour114, the monitor-activity lamp, so the two greens stay separate ideas.
set -g @win-fill "#{?window_bell_flag,203,#{?window_activity_flag,203,232}}"
set -g @win-fg "#{?window_bell_flag,16,#{?window_activity_flag,16,#{?window_last_flag,151,252}}}"
set -g window-status-format "#[fg=colour#{E:@win-fill}]#[bg=colour234]#[fg=colour#{E:@win-fg}]#[bg=colour#{E:@win-fill}]#[bold] #I #W#{?window_zoomed_flag, Z,} #[fg=colour#{E:@win-fill}]#[bg=colour234]#[nobold]"

# Current window: orange text between thin cap glyphs (E0B7/E0B5), so the pill
# is outlined rather than filled -- the filled caps used elsewhere would put a
# saturated block back on the one window that does not need shouting about.
# colour214 is also pane-active-border, display-panes-active and clock-mode, so
# "orange means the active thing" holds across all of tmux. It was colour220
# yellow, which matched nothing else.
set -g window-status-current-format "#[fg=colour214]#[bg=colour232]#[fg=colour214]#[bg=colour232]#[bold] #I #W#{?window_zoomed_flag, Z,} #[fg=colour214]#[bg=colour232]#[nobold]"

# The pills carry every colour themselves; these would only fight them. Set to
# default so tmux's status-format skips applying them at all.
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-separator " "

set -g status-left-length 5
set -g status-left '#[fg=colour16,bg=colour254,bold]#[fg=colour254,bg=colour234,nobold]'
# Status lamps: transient tmux state that has nowhere else to live (xmobar
# already owns every system metric). They all sit in status-right because that
# field is right-aligned -- a lamp lighting up grows leftward into the empty
# middle of the bar and never shifts the window list under your eyes. Each
# branch carries its own trailing space, so with every lamp dark the bar is
# byte-identical to what it was before.

# Dead panes across the whole session: remain-on-exit is on, so exited panes
# linger until "bind r" respawns them. #{W:} walks the windows and #{P:} the
# panes of each. Held in an option and expanded with #{E:} because both the
# conditional and the count need it, and once is enough.
set -g @lamp-dead "#{n:#{W:#{P:#{?pane_dead,x,}}}}"

set -g status-right-length 100
set -g status-right ""

# Prefix/repeat. #{client_prefix} is not "prefix was pressed" -- it is "current
# key table != default" (format.c: format_cb_client_prefix), so it also stays
# lit for the whole -r repeat window of "bind -r n/p" and "bind -r H/J/K/L".
# tmux calls server_status_client() on every key-table change including the
# repeat timer expiring, so this redraws on the keystroke, not on status-interval.
set -ga status-right "#{?client_prefix,#[fg=colour16]#[bg=colour214]#[bold] 󰌌 #{?#{==:#{client_key_table},prefix},C-k,#{client_key_table}} #[default] ,}"

# Copy mode, and any other pane mode.
set -ga status-right "#{?pane_in_mode,#[fg=colour16]#[bg=colour110]#[bold] 󰆏 #{s/-mode$//:pane_mode} #[default] ,}"

# synchronize-panes: every keystroke hits every pane, so this one shouts.
set -ga status-right "#{?pane_synchronized,#[fg=colour231]#[bg=colour160]#[bold] 󰓦 SYNC #[default] ,}"

# Corpses left behind by remain-on-exit.
set -ga status-right "#{?#{E:@lamp-dead},#[fg=colour203]#[bold]󰚌 #{E:@lamp-dead}#[default] ,}"

# Watch state for the current window, set by "bind m" / "bind M". The
# display-message those emit lasts 5 seconds; these do not.
set -ga status-right "#{?monitor-activity,#[fg=colour114]#[bold]󰈈#[default] ,}"
set -ga status-right "#{?monitor-silence,#[fg=colour114]#[bold]󰤄#{monitor-silence}s#[default] ,}"

set -ga status-right "#[fg=colour232]#[bg=colour234]#[fg=colour252]#[bg=colour232]#[bold] #{user}@#h #[bold]#S#[nobold] #[fg=colour232]#[bg=colour234]#[nobold] #[fg=colour232]#[bg=colour234]#[fg=colour252]#[bg=colour232] #D #[fg=colour232]#[bg=colour234]#[nobold]"

# Bell and activity are painted by @win-fill/@win-fg above (red fill, white
# text) so that an alert owns the only saturated background on the bar.
set -g window-status-bell-style default
set -g window-status-activity-style default

set -g bell-action any
set -g monitor-bell on
set -g visual-activity off
set -g visual-silence off

# visual-silence off means the alert is *only* a bell to the terminal, which
# nothing acts on once the ghostty window is on another workspace. Mirror it
# into dunst. The hook's formats resolve against the alerting window, so the
# notification names the window that went quiet rather than the focused one;
# q: quotes each field, window names contain spaces.
set-hook -g alert-silence 'run-shell -b "@silence-notify@ #{q:session_name} #{q:window_index} #{q:window_name} #{q:hook_window}"'

# tmux-fingers styling
set -g @fingers-hint-style "fg=black,bg=green,bold"
set -g @fingers-highlight-style "fg=black,bg=colour208"
set -g @fingers-backdrop-style "dim"
set -g @fingers-enable-bindings 0
bind F run -b "#{@fingers-cli} start #{pane_id}"
